<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tennis Stroke Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0d1014;
    --panel: #14171c;
    --line: #20252d;
    --text: #d8dde6;
    --muted: #5c6470;
    --accent: #ff6b35;
    --player-a: #4fc3f7;
    --player-b: #ffd166;
    --joint: #ffffff;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-rows: 1fr auto;
    height: 100vh;
  }

  /* ===== Stage with two video panes ===== */
  .stage {
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    position: relative;
    background: #000;
  }
  .stage::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 1px;
    background: var(--line);
    pointer-events: none;
    z-index: 5;
  }

  .player-pane {
    position: relative;
    overflow: hidden;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Video and overlay canvas occupy the same space */
  .pane-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pane-video, .pane-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .pane-canvas { pointer-events: none; }
  .pane-video { display: none; }
  .pane-video.loaded { display: block; }

  .player-name {
    position: absolute;
    top: 16px;
    left: 20px;
    z-index: 3;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    pointer-events: none;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  .player-pane.a .player-name { color: var(--player-a); }
  .player-pane.b .player-name { color: var(--player-b); }

  .load-controls {
    position: absolute;
    top: 16px;
    right: 20px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }
  .load-link {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    background: rgba(0,0,0,0.5);
    border: none;
    padding: 4px 8px;
    border-radius: 2px;
    font-family: var(--mono);
    backdrop-filter: blur(4px);
  }
  .load-link:hover { color: var(--text); }
  .load-link.loaded { color: var(--text); opacity: 0.7; }
  input[type="file"] { display: none; }

  .empty-hint {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: center;
    line-height: 2;
  }
  .empty-hint .step { display: block; }
  .empty-hint .num { color: var(--accent); margin-right: 8px; }
  .empty-hint .done { color: var(--text); }

  /* ===== Controls ===== */
  .controls {
    padding: 18px 24px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  .slider-row {
    position: relative;
    height: 28px;
    margin-bottom: 12px;
  }
  .slider-row::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: var(--line);
    transform: translateY(-50%);
    pointer-events: none;
  }
  .contact-tick {
    position: absolute;
    left: 50%;
    top: 30%;
    bottom: 30%;
    width: 1px;
    background: var(--accent);
    transform: translateX(-50%);
    pointer-events: none;
  }
  .scrubber {
    position: absolute;
    left: 0; right: 0;
    top: 0; bottom: 0;
    width: 100%;
    appearance: none;
    background: transparent;
    cursor: ew-resize;
    margin: 0;
  }
  .scrubber:disabled { cursor: not-allowed; opacity: 0.3; }
  .scrubber::-webkit-slider-runnable-track { height: 28px; background: transparent; }
  .scrubber::-moz-range-track { height: 28px; background: transparent; border: none; }
  .scrubber::-webkit-slider-thumb {
    appearance: none;
    width: 2px;
    height: 28px;
    background: var(--text);
    cursor: ew-resize;
    margin-top: 0;
  }
  .scrubber::-moz-range-thumb {
    width: 2px;
    height: 28px;
    background: var(--text);
    cursor: ew-resize;
    border: none;
  }
  .scrubber:focus { outline: none; }

  .control-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }
  .left-controls, .right-controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .ctrl-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px 0;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .ctrl-btn:hover:not(:disabled) { color: var(--text); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .ctrl-btn.primary { color: var(--text); min-width: 50px; text-align: left; }
  .speed-select {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    padding: 4px 0;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    appearance: none;
    -webkit-appearance: none;
  }
  .speed-select:hover { color: var(--text); border-bottom-color: var(--text); }
  .speed-select:focus { outline: none; }

  .toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .toggle input { display: none; }
  .toggle .swatch {
    width: 22px;
    height: 12px;
    background: var(--line);
    border-radius: 6px;
    position: relative;
    transition: background 0.15s;
  }
  .toggle .swatch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 8px;
    height: 8px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform 0.15s, background 0.15s;
  }
  .toggle input:checked + .swatch { background: var(--accent); }
  .toggle input:checked + .swatch::after { transform: translateX(10px); background: #fff; }
  .toggle:hover { color: var(--text); }

  .timecode {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .timecode .sign { color: var(--muted); display: inline-block; width: 0.6em; }
  /* Reserve room for the widest value we display, so adding or removing a
     digit doesn't resize the timecode and shove the rest of the control bar
     sideways. tabular-nums keeps every digit the same width. */
  .timecode .value {
    display: inline-block;
    min-width: 4.5ch;
    text-align: right;
  }
  .timecode .unit { color: var(--muted); font-size: 11px; margin-left: 6px; letter-spacing: 0.1em; }
  .timecode.at-contact { color: var(--accent); }

  /* ===== Extraction progress overlay ===== */
  .extract-status {
    position: absolute;
    inset: 0;
    z-index: 4;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(2px);
    color: var(--text);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .extract-status.active { display: flex; }
  .extract-status .msg { color: var(--muted); }
  .extract-status .pct { font-size: 26px; font-weight: 500; letter-spacing: 0.02em; color: var(--text); font-variant-numeric: tabular-nums; }
  .extract-bar {
    width: 44%;
    height: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .extract-bar > span {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    background: var(--accent);
    transition: width 0.1s linear;
  }

  .load-link.mark {
    color: var(--accent);
    opacity: 0.85;
  }
  .load-link.mark:hover { opacity: 1; }
</style>
</head>

  <div class="controls">

<!-- ==========================================================================
     In-browser pose extraction (MediaPipe Tasks Vision, WASM).
     Replaces the offline src/extract_poses.py step: drop a video and the
     skeleton is generated client-side. Runtime + model are vendored under
     viewer/vendor and models/ so this works fully offline.
     ========================================================================== -->
<script type="module">
import { FilesetResolver, PoseLandmarker } from "./vendor/vision_bundle.mjs";

// Same 13 keypoints and MediaPipe indices as src/extract_poses.py
const KEYPOINTS_IDX = {
  nose: 0,
  left_shoulder: 11, right_shoulder: 12,
  left_elbow: 13, right_elbow: 14,
  left_wrist: 15, right_wrist: 16,
  left_hip: 23, right_hip: 24,
  left_knee: 25, right_knee: 26,
  left_ankle: 27, right_ankle: 28,
};

// Pose models are fetched from Google's MediaPipe storage rather than checked
// into the repo (they total ~44MB). The WASM runtime in viewer/vendor is still
// vendored, so only the model weights need the network.
// To run fully offline, download them into models/ (see README) and swap these
// for "../models/pose_landmarker_<quality>.task".
const MODEL_CDN = "https://storage.googleapis.com/mediapipe-models/pose_landmarker";
const MODEL_PATHS = {
  lite:  `${MODEL_CDN}/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task`,
  full:  `${MODEL_CDN}/pose_landmarker_full/float16/latest/pose_landmarker_full.task`,
  heavy: `${MODEL_CDN}/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task`,
};

// Common capture rates we snap the estimated fps to.
const COMMON_FPS = [24, 25, 30, 50, 60, 120, 240];

let _filesetPromise = null;
function getFileset() {
  if (!_filesetPromise) _filesetPromise = FilesetResolver.forVisionTasks("vendor/wasm");
  return _filesetPromise;
}

// Create a fresh landmarker per clip so pose tracking state doesn't bleed
// between the two videos. GPU delegate when available, CPU fallback otherwise.
async function makeLandmarker(quality) {
  const fileset = await getFileset();
  const modelAssetPath = MODEL_PATHS[quality] || MODEL_PATHS.full;
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath, delegate },
    runningMode: "VIDEO",
    numPoses: 1,
    minPoseDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5,
    minPosePresenceConfidence: 0.5,
  });
  try {
    return await PoseLandmarker.createFromOptions(fileset, opts("GPU"));
  } catch (e) {
    console.warn("GPU delegate unavailable, using CPU:", e);
    return await PoseLandmarker.createFromOptions(fileset, opts("CPU"));
  }
}

// Seek to time t and resolve once the frame is ready. Resolves immediately if
// already at t (setting currentTime to its current value fires no "seeked"),
// and has a safety timeout so a missed event can't hang extraction.
function seekTo(video, t) {
  if (Math.abs(video.currentTime - t) < 1e-4) return Promise.resolve();
  return new Promise((res) => {
    let done = false;
    const finish = () => { if (done) return; done = true; video.removeEventListener("seeked", finish); res(); };
    video.addEventListener("seeked", finish);
    video.currentTime = t;
    setTimeout(finish, 2000);
  });
}

// Estimate frame rate by watching a few real frames via requestVideoFrameCallback.
async function probeFps(video) {
  if (typeof video.requestVideoFrameCallback !== "function") return 30;
  video.pause();
  await seekTo(video, 0);
  const times = [];
  await new Promise((res) => {
    let n = 0;
    const timeout = setTimeout(() => { video.pause(); res(); }, 4000);
    const cb = (_now, meta) => {
      times.push(meta.mediaTime);
      if (++n >= 30) { clearTimeout(timeout); video.pause(); res(); }
      else video.requestVideoFrameCallback(cb);
    };
    video.requestVideoFrameCallback(cb);
    video.play().catch(() => { clearTimeout(timeout); res(); });
  });
  // Use the SMALLEST gap between presented frames, not the median. When the
  // compositor drops frames (throttled tab, busy page) the callback skips
  // frames, which only ever inflates a gap — never shrinks it. So the minimum
  // gap is the best estimate of the true frame interval, while a median gets
  // dragged toward a multiple of it and badly underestimates fps.
  const deltas = [];
  for (let i = 1; i < times.length; i++) {
    const d = times[i] - times[i - 1];
    if (d > 2e-3) deltas.push(d); // 2ms floor: excludes spurious repeats, allows up to 500fps
  }
  if (!deltas.length) return 30;
  let fps = Math.round(1 / Math.min(...deltas));
  for (const c of COMMON_FPS) { if (Math.abs(fps - c) <= 2) { fps = c; break; } }
  return Math.max(1, fps);
}

function jointsFromResult(res, w, h) {
  if (!res.landmarks || !res.landmarks.length) return null;
  const lms = res.landmarks[0];
  const out = {};
  for (const name in KEYPOINTS_IDX) {
    const lm = lms[KEYPOINTS_IDX[name]];
    out[name] = {
      x: lm.x * w,
      y: lm.y * h,
      visibility: (lm.visibility ?? 1),
    };
  }
  return out;
}

// Extract poses for every frame. Returns the same {metadata, frames} shape the
// viewer already consumes, with contact defaulted to the middle frame (the
// user refines it with "mark contact").
async function extract(video, { quality = "full", player = "clip", handedness = "right", onProgress } = {}) {
  const landmarker = await makeLandmarker(quality);
  const w = video.videoWidth, h = video.videoHeight;
  const fps = await probeFps(video);
  const total = Math.max(1, Math.round(video.duration * fps));

  const frames = [];
  let lastTs = -1;
  try {
    for (let i = 0; i < total; i++) {
      const target = Math.min(i / fps, Math.max(0, video.duration - 1e-3));
      await seekTo(video, target);
      // `duration` can overshoot the last real frame (containers often round
      // up). Once seeking stops advancing we've run off the end — stop rather
      // than recording duplicates of the final frame.
      if (frames.length &&
          Math.abs(video.currentTime - frames[frames.length - 1].video_time) < 1e-4) break;
      // detectForVideo requires strictly increasing timestamps.
      let ts = Math.round((i / fps) * 1000);
      if (ts <= lastTs) ts = lastTs + 1;
      lastTs = ts;
      const res = landmarker.detectForVideo(video, ts);
      frames.push({
        frame_idx: i,
        video_time: video.currentTime,
        time_ms: 0, // filled in once contact is known
        joints: jointsFromResult(res, w, h),
      });
      if (onProgress && (i % 2 === 0 || i === total - 1)) onProgress((i + 1) / total);
    }
  } finally {
    landmarker.close();
  }

  // Time is measured from each frame's real video_time, not frame_idx/fps, so a
  // slightly-off fps estimate can't skew alignment between two clips.
  const contactFrame = Math.floor(frames.length / 2);
  const contactT = frames[contactFrame].video_time;
  for (const f of frames) f.time_ms = (f.video_time - contactT) * 1000;
  const missed = frames.filter((f) => !f.joints).length;

  return {
    metadata: {
      player,
      handedness,
      fps,
      width: w,
      height: h,
      total_frames: frames.length,
      contact_frame: contactFrame,
      missed_frames: missed,
      keypoints: Object.keys(KEYPOINTS_IDX),
      source: "in-browser",
    },
    frames,
  };
}

// Warm the WASM runtime + fileset ahead of first use.
async function warm() { try { await getFileset(); } catch (_) {} }

window.PoseExtractor = { extract, warm };
window.dispatchEvent(new Event("pose-extractor-ready"));
</script>

<script>
// ============================================================================
// Skeleton edges, identical to the Python script
// ============================================================================
const EDGES = [
  ["left_shoulder", "right_shoulder"],
  ["left_shoulder", "left_elbow"],
  ["left_elbow", "left_wrist"],
  ["right_shoulder", "right_elbow"],
  ["right_elbow", "right_wrist"],
  ["left_shoulder", "left_hip"],
  ["right_shoulder", "right_hip"],
  ["left_hip", "right_hip"],
  ["left_hip", "left_knee"],
  ["left_knee", "left_ankle"],
  ["right_hip", "right_knee"],
  ["right_knee", "right_ankle"],
];
const HEAD_KEYPOINT = "nose";
const VISIBILITY_THRESHOLD = 0.3;

// How far past the wrist to extend the racquet line, in units of forearm length.
// Forearm ≈ elbow→wrist, racquet ≈ 1.5× forearm length on average.
const RACQUET_EXTENSION = 1.6;

const COLORS = {
  a: { skeleton: "#4fc3f7", joint: "#ffffff", racquet: "#4fc3f7" },
  b: { skeleton: "#ffd166", joint: "#ffffff", racquet: "#ffd166" },
};

// ============================================================================
// State
// ============================================================================
const state = {
  a: { video: null, data: null, ready: false },
  b: { video: null, data: null, ready: false },
  currentTimeMs: 0,
  windowMs: 1000,
  playing: false,
  playbackRate: 1.0,
  lastFrameTimestamp: null,
  lastHardSeek: 0,
  showOverlay: true,
  showRacquet: true,
};

// --- Secondary-video sync tuning -------------------------------------------
// The non-primary video is kept in step with the primary. Seeking it flushes
// the decoder, so seeking every frame makes it stutter and eventually lock up
// (each seek costs more time than the drift it corrects, so it never catches
// up). Instead we nudge its playbackRate for small drift and only hard-seek
// when it is genuinely far out, with a cooldown.
const SYNC_DEADBAND_S = 0.04;      // below this, leave it alone
const SYNC_HARD_S = 0.35;          // above this, hard seek
const SYNC_HARD_COOLDOWN_MS = 800; // min gap between hard seeks
const SYNC_MAX_RATE_ADJ = 0.15;    // cap rate correction at +/-15%
const SYNC_GAIN = 2.0;             // rate adjust per second of drift

// ============================================================================
// Loading
// ============================================================================
async function loadJsonFile(file) {
  const text = await file.text();
  const data = JSON.parse(text);
  if (!data.metadata || !Array.isArray(data.frames)) {
    throw new Error("Invalid JSON: expected {metadata, frames}");
  }
  if (data.metadata.normalized) {
    throw new Error("Use the raw JSON (not normalized) for video overlay mode.");
  }
  if (data.frames.length === 0) throw new Error("JSON has no frames.");
  return data;
}

function loadVideoFile(slot, file) {
  const video = document.getElementById(`video-${slot}`);
  // Revoke previous object URL if any to avoid memory leak
  if (video.src && video.src.startsWith("blob:")) {
    URL.revokeObjectURL(video.src);
  }
  const url = URL.createObjectURL(file);
  return new Promise((resolve, reject) => {
    video.onloadedmetadata = () => {
      video.classList.add("loaded");
      resolve(video);
    };
    video.onerror = () => reject(new Error("Failed to load video"));
    video.src = url;
  });
}

function checkSlotReady(slot) {
  const s = state[slot];
  s.ready = !!(s.video && s.data);
  if (s.ready) {
    document.getElementById(`empty-${slot}`).style.display = "none";
    const player = s.data.metadata.player || "unknown";
    document.getElementById(`name-${slot}`).textContent = player;
    resizeCanvas(slot);
    syncVideo(slot);
  }
  updateGlobalReady();
}

function updateGlobalReady() {
  const anyReady = state.a.ready || state.b.ready;
  // Slider/buttons enable as soon as at least one slot is ready;
  // only-one-slot is fine, the other pane just stays black
  document.getElementById("scrubber").disabled = !anyReady;
  for (const id of ["play-pause", "step-back", "step-forward", "reset"]) {
    document.getElementById(id).disabled = !anyReady;
  }
  if (anyReady) {
    updateTimeWindow();
    render();
  }
}

function updateTimeWindow() {
  const ranges = [];
  for (const slot of ["a", "b"]) {
    if (!state[slot].ready) continue;
    const t = state[slot].data.frames.map(f => f.time_ms);
    ranges.push({ min: Math.min(...t), max: Math.max(...t) });
  }
  if (!ranges.length) return;
  const minT = Math.max(...ranges.map(r => r.min));
  const maxT = Math.min(...ranges.map(r => r.max));
  const half = Math.min(Math.abs(minT), Math.abs(maxT));
  state.windowMs = Math.max(half, 200);

  const sc = document.getElementById("scrubber");
  sc.min = -state.windowMs;
  sc.max = state.windowMs;
  sc.value = state.currentTimeMs;
}

// ============================================================================
// Time → frame → video.currentTime mapping
// ============================================================================
function jointsAtTime(data, timeMs) {
  const frames = data.frames;
  if (timeMs <= frames[0].time_ms) return frames[0];
  if (timeMs >= frames[frames.length - 1].time_ms) return frames[frames.length - 1];
  let lo = 0, hi = frames.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (frames[mid].time_ms <= timeMs) lo = mid;
    else hi = mid;
  }
  // Pick whichever bracketing frame is closer in time. We don't interpolate
  // joint coordinates here because we want them to match the actual displayed
  // video frame — interpolated joints would float between video frames.
  const a = frames[lo], b = frames[hi];
  return Math.abs(timeMs - a.time_ms) <= Math.abs(timeMs - b.time_ms) ? a : b;
}

// A frame's absolute time in the source video, in seconds. In-browser
// extraction records video_time directly; Python-generated JSON doesn't, so
// fall back to frame_idx/fps for those (they're frame-exact anyway).
function frameSeconds(data, frame) {
  if (frame && frame.video_time !== undefined) return frame.video_time;
  return frame.frame_idx / (data.metadata.fps || 30);
}

// Absolute video time of this clip's contact frame, in seconds.
function contactSeconds(slot) {
  const data = state[slot].data;
  const frame = data.frames[data.metadata.contact_frame] || data.frames[0];
  return frameSeconds(data, frame);
}

function syncVideo(slot) {
  const s = state[slot];
  if (!s.ready) return;
  const meta = s.data.metadata;
  // For a slider position of currentTimeMs, the corresponding video time is:
  //   contact_time + currentTimeMs/1000
  const contactSec = contactSeconds(slot);
  const targetSec = contactSec + state.currentTimeMs / 1000;
  // Clamp into video bounds
  const clamped = Math.max(0, Math.min(s.video.duration || 1e9, targetSec));
  // Avoid setting currentTime if the difference is below one frame — reduces
  // unnecessary seeks during playback
  if (Math.abs(s.video.currentTime - clamped) > (1 / meta.fps) * 0.5) {
    s.video.currentTime = clamped;
  }
}

// ============================================================================
// Canvas overlay rendering
// ============================================================================
function resizeCanvas(slot) {
  const s = state[slot];
  if (!s.video) return;
  const canvas = document.getElementById(`canvas-${slot}`);
  // The video element has object-fit: contain, so the actual display area
  // is letterboxed. We need to match the canvas pixel space to that.
  const rect = canvas.getBoundingClientRect();
  // Use device pixel ratio for crisp lines on retina displays
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function getDisplayedVideoRect(video, canvas) {
  // Compute the actual pixel rectangle the video occupies inside its element,
  // accounting for object-fit: contain (letterboxing).
  const cw = canvas.getBoundingClientRect().width;
  const ch = canvas.getBoundingClientRect().height;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return { x: 0, y: 0, w: cw, h: ch, scaleX: 1, scaleY: 1 };
  const scale = Math.min(cw / vw, ch / vh);
  const dispW = vw * scale;
  const dispH = vh * scale;
  return {
    x: (cw - dispW) / 2,
    y: (ch - dispH) / 2,
    w: dispW,
    h: dispH,
    scaleX: scale,
    scaleY: scale,
  };
}

function drawSkeleton(slot) {
  const s = state[slot];
  const canvas = document.getElementById(`canvas-${slot}`);
  const ctx = canvas.getContext("2d");
  const rect = canvas.getBoundingClientRect();
  ctx.clearRect(0, 0, rect.width, rect.height);

  if (!s.ready || !state.showOverlay) return;

  // Look up joints from THIS video's currentTime so the skeleton stays in
  // perfect sync with the displayed frame, even if the slider polling has
  // drifted slightly during playback.
  const ms = msFromVideoTime(slot, s.video.currentTime);
  const frame = jointsAtTime(s.data, ms);
  const joints = frame.joints;
  if (!joints) return;

  // Project joint coords (which are in original video pixel space) to the
  // displayed video rectangle on canvas.
  const v = getDisplayedVideoRect(s.video, canvas);
  const project = (j) => ({
    x: v.x + j.x * v.scaleX,
    y: v.y + j.y * v.scaleY,
  });

  const colors = COLORS[slot];
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Skeleton edges
  ctx.strokeStyle = colors.skeleton;
  ctx.lineWidth = 3;
  for (const [a, b] of EDGES) {
    const ja = joints[a], jb = joints[b];
    if (!ja || !jb) continue;
    if (ja.visibility < VISIBILITY_THRESHOLD || jb.visibility < VISIBILITY_THRESHOLD) continue;
    const pa = project(ja), pb = project(jb);
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }

  // Head circle
  const head = joints[HEAD_KEYPOINT];
  if (head && head.visibility >= VISIBILITY_THRESHOLD) {
    const ph = project(head);
    // Estimate head radius from distance between shoulders
    const ls = joints.left_shoulder, rs = joints.right_shoulder;
    let r = 12;
    if (ls && rs) {
      const pls = project(ls), prs = project(rs);
      const shoulderWidth = Math.hypot(prs.x - pls.x, prs.y - pls.y);
      r = shoulderWidth * 0.45;
    }
    ctx.beginPath();
    ctx.arc(ph.x, ph.y - r * 0.4, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Joint dots
  ctx.fillStyle = colors.joint;
  for (const name in joints) {
    if (name === HEAD_KEYPOINT) continue;
    const j = joints[name];
    if (j.visibility < VISIBILITY_THRESHOLD) continue;
    const p = project(j);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Racquet line: extend from elbow→wrist beyond the wrist
  if (state.showRacquet) {
    const handedness = s.data.metadata.handedness || "right";
    const wristKey = `${handedness}_wrist`;
    const elbowKey = `${handedness}_elbow`;
    const w = joints[wristKey], e = joints[elbowKey];
    if (w && e && w.visibility >= VISIBILITY_THRESHOLD && e.visibility >= VISIBILITY_THRESHOLD) {
      const pw = project(w), pe = project(e);
      const dx = pw.x - pe.x;
      const dy = pw.y - pe.y;
      const tipX = pw.x + dx * RACQUET_EXTENSION;
      const tipY = pw.y + dy * RACQUET_EXTENSION;
      ctx.strokeStyle = colors.racquet;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.7;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(pw.x, pw.y);
      ctx.lineTo(tipX, tipY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      // Small circle at racquet tip
      ctx.fillStyle = colors.racquet;
      ctx.beginPath();
      ctx.arc(tipX, tipY, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function render() {
  // This is called on manual scrub (slider drag, step buttons, reset).
  // It seeks each video and redraws the overlay. During playback, the video
  // plays natively and we don't seek — see playbackLoop().
  for (const slot of ["a", "b"]) {
    if (state[slot].ready) {
      syncVideo(slot);
      drawSkeleton(slot);
    }
  }
  updateTimecode();
}

// ============================================================================
// Playback
// ============================================================================
// Strategy:
// - When playing, we call video.play() on each ready video at the chosen rate
//   and let the browser play it natively. This is fast and smooth — unlike
//   seeking via currentTime= 60 times per second, which the browser hates.
// - A polling loop watches the "primary" video (slot a, falling back to b)
//   and updates the slider/timecode/secondary-video to follow. We don't try
//   to keep the two videos in lockstep at the millisecond level — we use the
//   primary's currentTime to compute time-from-contact, then sync the
//   secondary's currentTime to match. Tiny drift is fine; the slider position
//   reflects the primary's actual playback time.
// - When playback runs past the end of the window (or end of clip), we pause,
//   loop back to start of window, and restart.

function primarySlot() {
  return state.a.ready ? "a" : (state.b.ready ? "b" : null);
}

function videoTimeFromMs(slot, ms) {
  // Convert ms-from-contact to absolute video time (seconds) for this slot.
  return contactSeconds(slot) + ms / 1000;
}

function msFromVideoTime(slot, sec) {
  return (sec - contactSeconds(slot)) * 1000;
}

function setPlaying(p) {
  state.playing = p;
  document.getElementById("play-pause").textContent = p ? "pause" : "play";
  state.lastHardSeek = 0;

  for (const slot of ["a", "b"]) {
    const s = state[slot];
    if (!s.ready) continue;
    // Always restore the true rate — the sync logic may have left the
    // secondary running slightly fast or slow.
    s.video.playbackRate = state.playbackRate;
    if (p) {
      // Restart from beginning of window if we're at the end
      if (state.currentTimeMs >= state.windowMs - 5) {
        state.currentTimeMs = -state.windowMs;
        s.video.currentTime = videoTimeFromMs(slot, state.currentTimeMs);
      }
      s.video.play().catch(err => console.warn(`play(${slot}) failed:`, err));
    } else {
      s.video.pause();
    }
  }

  if (p) requestAnimationFrame(playbackLoop);
}

// Keep a secondary video in step with the primary without seek-thrashing it.
function syncSecondary(slot, ms, now) {
  const v = state[slot].video;
  const base = state.playbackRate;
  const drift = v.currentTime - videoTimeFromMs(slot, ms); // + = running ahead

  if (Math.abs(drift) >= SYNC_HARD_S) {
    // Genuinely out of sync (a stall, or the user jumped). Correct hard, but
    // rate-limited — an uncooled seek loop is exactly what froze this pane.
    if (now - state.lastHardSeek >= SYNC_HARD_COOLDOWN_MS) {
      state.lastHardSeek = now;
      v.playbackRate = base;
      v.currentTime = videoTimeFromMs(slot, ms);
    }
    return;
  }

  if (Math.abs(drift) < SYNC_DEADBAND_S) {
    if (v.playbackRate !== base) v.playbackRate = base;
    return;
  }

  // Small drift: ease back by running slightly fast/slow. No decoder flush.
  const adj = Math.max(-SYNC_MAX_RATE_ADJ, Math.min(SYNC_MAX_RATE_ADJ, -drift * SYNC_GAIN));
  const rate = Math.max(0.0625, base * (1 + adj));
  if (Math.abs(v.playbackRate - rate) > 1e-3) v.playbackRate = rate;
}

function playbackLoop() {
  if (!state.playing) return;

  const primary = primarySlot();
  if (!primary) { state.playing = false; return; }

  // Read where the primary video actually is, in ms-from-contact
  const ms = msFromVideoTime(primary, state[primary].video.currentTime);
  state.currentTimeMs = ms;

  // Loop at end of window. Also loop if the primary clip simply ran out —
  // otherwise its currentTime stops advancing, ms never reaches windowMs, and
  // playback hangs with both panes frozen.
  const now = performance.now();
  if (ms >= state.windowMs || state[primary].video.ended) {
    state.currentTimeMs = -state.windowMs;
    state.lastHardSeek = now;
    for (const slot of ["a", "b"]) {
      if (!state[slot].ready) continue;
      state[slot].video.playbackRate = state.playbackRate;
      state[slot].video.currentTime = videoTimeFromMs(slot, state.currentTimeMs);
      if (state[slot].video.paused) {
        state[slot].video.play().catch(() => {});
      }
    }
  } else {
    for (const slot of ["a", "b"]) {
      if (slot === primary || !state[slot].ready) continue;
      syncSecondary(slot, ms, now);
    }
  }

  // Update slider and timecode (skeleton draw is handled by video frame events)
  document.getElementById("scrubber").value = state.currentTimeMs;
  updateTimecode();

  requestAnimationFrame(playbackLoop);
}

function stepTime(deltaMs) {
  // Always pause when stepping
  if (state.playing) setPlaying(false);
  state.currentTimeMs = Math.max(-state.windowMs,
                                  Math.min(state.windowMs, state.currentTimeMs + deltaMs));
  document.getElementById("scrubber").value = state.currentTimeMs;
  render();
}

function updateTimecode() {
  const ms = state.currentTimeMs;
  const tc = document.getElementById("timecode");
  document.getElementById("tc-sign").textContent = ms === 0 ? "" : (ms > 0 ? "+" : "−");
  document.getElementById("tc-value").textContent = Math.abs(Math.round(ms));
  tc.classList.toggle("at-contact", Math.abs(ms) < 5);
}

// ============================================================================
// Extraction helpers
// ============================================================================
function currentQuality() {
  return document.getElementById("quality").value || "full";
}

function nameFromFilename(filename) {
  // "novak_bh.mp4" -> "novak"; fall back to the stem.
  const stem = filename.replace(/\.[^.]+$/, "");
  return stem.split(/[_\-.]/)[0] || stem || "clip";
}

// Show/update the per-pane extraction overlay. `active` defaults to true so
// progress updates (which omit it) keep the overlay up; hiding is explicit.
function setExtractStatus(slot, msg, progress, active = true) {
  const el = document.getElementById(`status-${slot}`);
  el.classList.toggle("active", !!active);
  if (msg !== undefined && msg !== "") document.getElementById(`status-${slot}-msg`).textContent = msg;
  const pct = Math.round((progress || 0) * 100);
  document.getElementById(`status-${slot}-pct`).textContent = pct + "%";
  document.getElementById(`status-${slot}-bar`).style.width = pct + "%";
}

// Re-center a clip's timeline on a chosen contact frame and refresh the view.
function setContactFrame(slot, contactFrame) {
  const s = state[slot];
  if (!s.data) return;
  s.data.metadata.contact_frame = contactFrame;
  const contactT = contactSeconds(slot);
  for (const f of s.data.frames) {
    f.time_ms = (frameSeconds(s.data, f) - contactT) * 1000;
  }
  state.currentTimeMs = 0;
  updateTimeWindow();
  document.getElementById("scrubber").value = 0;
  render();
}

// Map this pane's current video time to its nearest extracted frame index.
function currentFrameIndex(slot) {
  const s = state[slot];
  const vt = s.video.currentTime;
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < s.data.frames.length; i++) {
    const f = s.data.frames[i];
    const d = Math.abs(frameSeconds(s.data, f) - vt);
    if (d < bestDist) { bestDist = d; best = f.frame_idx; }
  }
  return best;
}

// Warm the runtime early so the first extraction isn't cold.
window.addEventListener("pose-extractor-ready", () => window.PoseExtractor.warm());

// ============================================================================
// Wiring
// ============================================================================
for (const slot of ["a", "b"]) {
  document.getElementById(`mark-${slot}-btn`).addEventListener("click", () => {
    if (state.playing) setPlaying(false);
    setContactFrame(slot, currentFrameIndex(slot));
    const btn = document.getElementById(`mark-${slot}-btn`);
    const prev = btn.textContent;
    btn.textContent = "contact set ✓";
    setTimeout(() => { btn.textContent = prev; }, 1200);
  });
  document.getElementById(`load-${slot}-video-btn`).addEventListener("click", () => {
    document.getElementById(`load-${slot}-video`).click();
  });
  document.getElementById(`load-${slot}-video`).addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const videoBtn = document.getElementById(`load-${slot}-video-btn`);
    try {
      const video = await loadVideoFile(slot, file);
      state[slot].video = video;
      videoBtn.textContent = "swap video";
      videoBtn.classList.add("loaded");

      // Auto-extract poses in-browser. This replaces the old "load json" step.
      if (!window.PoseExtractor) {
        await new Promise((res) => window.addEventListener("pose-extractor-ready", res, { once: true }));
      }
      setExtractStatus(slot, "loading model…", 0, true);
      const data = await window.PoseExtractor.extract(video, {
        quality: currentQuality(),
        player: nameFromFilename(file.name),
        handedness: "right",
        onProgress: (p) => setExtractStatus(slot, "extracting poses", p),
      });
      setExtractStatus(slot, "", 0, false);

      state[slot].data = data;
      document.getElementById(`mark-${slot}-btn`).style.display = "";
      checkSlotReady(slot);
    } catch (err) {
      setExtractStatus(slot, "", 0, false);
      alert("Extraction failed: " + err.message);
      console.error(err);
    }
  });
  document.getElementById(`load-${slot}-json-btn`).addEventListener("click", () => {
    document.getElementById(`load-${slot}-json`).click();
  });
  document.getElementById(`load-${slot}-json`).addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = await loadJsonFile(file);
      state[slot].data = data;
      document.getElementById(`load-${slot}-json-btn`).textContent = "swap json";
      document.getElementById(`load-${slot}-json-btn`).classList.add("loaded");
      document.getElementById(`mark-${slot}-btn`).style.display = "";
      checkSlotReady(slot);
    } catch (err) {
      alert("JSON load failed: " + err.message);
    }
  });
}

document.getElementById("scrubber").addEventListener("input", (e) => {
  // If playing, pause when user grabs the slider
  if (state.playing) setPlaying(false);
  state.currentTimeMs = parseFloat(e.target.value);
  render();
});

document.getElementById("play-pause").addEventListener("click", () => setPlaying(!state.playing));
document.getElementById("step-back").addEventListener("click", () => stepTime(-16.67));
document.getElementById("step-forward").addEventListener("click", () => stepTime(16.67));
document.getElementById("reset").addEventListener("click", () => {
  state.currentTimeMs = 0;
  document.getElementById("scrubber").value = 0;
  render();
});
document.getElementById("speed").addEventListener("change", (e) => {
  state.playbackRate = parseFloat(e.target.value);
  // If currently playing, apply to videos immediately
  for (const slot of ["a", "b"]) {
    if (state[slot].ready) state[slot].video.playbackRate = state.playbackRate;
  }
});
document.getElementById("overlay-toggle").addEventListener("change", (e) => {
  state.showOverlay = e.target.checked;
  render();
});
document.getElementById("racquet-toggle").addEventListener("change", (e) => {
  state.showRacquet = e.target.checked;
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const big = e.shiftKey ? 100 : 16.67;
  if (e.key === " ") { e.preventDefault(); if (!document.getElementById("play-pause").disabled) setPlaying(!state.playing); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); stepTime(-big); }
  else if (e.key === "ArrowRight") { e.preventDefault(); stepTime(big); }
  else if (e.key === "0") { e.preventDefault(); state.currentTimeMs = 0;
                            document.getElementById("scrubber").value = 0; render(); }
});

// Resize canvas when window resizes
window.addEventListener("resize", () => {
  for (const slot of ["a", "b"]) {
    if (state[slot].video) {
      resizeCanvas(slot);
      if (state[slot].ready) drawSkeleton(slot);
    }
  }
});

// Per-frame skeleton redraw.
// requestVideoFrameCallback fires once per actual video frame as it's about
// to be displayed — exactly what we need to keep the skeleton in sync with
// the video frames during playback. Falls back to timeupdate (less accurate,
// fires ~4x/sec) on browsers that don't support rVFC yet.
function attachFrameRedraw(slot) {
  const video = document.getElementById(`video-${slot}`);

  // Always redraw on a finished seek (manual scrub)
  video.addEventListener("seeked", () => drawSkeleton(slot));

  if (typeof video.requestVideoFrameCallback === "function") {
    const cb = () => {
      drawSkeleton(slot);
      video.requestVideoFrameCallback(cb);
    };
    video.requestVideoFrameCallback(cb);
  } else {
    // Fallback: timeupdate (limited to ~4Hz, but better than nothing)
    video.addEventListener("timeupdate", () => drawSkeleton(slot));
  }
}

for (const slot of ["a", "b"]) {
  attachFrameRedraw(slot);
}
</script>
</body>
</html>
